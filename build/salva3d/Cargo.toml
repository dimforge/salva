[package]
name = "salva3d"
version = "0.9.0"
authors = ["Sébastien Crozet <developer@crozet.re>"]
description = "3-dimensional particle-based fluid dynamics in Rust."
documentation = "https://salva.rs/rustdoc/salva3d/index.html"
homepage = "https://salva.rs"
repository = "https://github.com/dimforge/salva"
readme = "../../README.md"
keywords = ["physics", "dynamics", "particles", "fluids", "SPH"]
license = "Apache-2.0"
edition = "2021"

[lints]
rust.unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("dim2", "f64"))',
] }

[features]
default = [ "dim3", "f32" ]
dim3 = [ ]
f32 = [ ]
parallel = [ "rayon" ]
rapier = [ "parry", "rapier3d" ]
sampling = [ "rapier" ]
rapier-testbed = [ "rapier", "rapier_testbed3d", "kiss3d" ]
parry = [ "parry3d" ]

[lib]
name = "salva3d"
path = "../../src/lib.rs"
required-features = [ "dim3", "f32" ]

[dependencies]
approx = "0.5"
num-traits = "0.2"
fnv = "1.0"
itertools = "0.14"
generational-arena = "0.2"
rayon = { version = "1.8", optional = true }

nalgebra = { version = "0.35", features = ["convert-glam033"] }
glamx = { version = "0.3", features = ["nalgebra"] }
parry3d = { version = "0.30", optional = true }
rapier3d = { version = "0.35.1", optional = true }
rapier_testbed3d = { version = "0.35.1", optional = true }
kiss3d = { version = "0.45", optional = true }

bitflags = "2.6.0"
